[package]
name = "univim"
version = "0.1.0"
edition = "2024"
default-run = "univim"

[dependencies]
opencv = { version = "0.96", default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-hyprland = { version = "1.2", features = ["client"] }
nix = { version = "0.30", features = ["poll", "signal"] }
libc = "0.2"
tempfile = "3"
xkbcommon = "0.8"

[[bin]]
name = "univim-desktop"
path = "src/bin/univim-desktop.rs"

[profile.release]
lto = "thin"
