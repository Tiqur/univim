[package]
name = "univim"
version = "0.1.0"
edition = "2024"

[dependencies]
opencv = { version = "0.96", default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
